# The eventsourcing suite runs against in-memory H2 (no docker), overriding the file-H2 default
# shipped in this jar's META-INF/microprofile-config.properties. clean-at-start wipes between runs.
quarkus.datasource.eventsourcing.db-kind=h2
quarkus.datasource.eventsourcing.jdbc.url=jdbc:h2:mem:eventsourcing;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.eventsourcing.datasource=eventsourcing
quarkus.hibernate-orm.eventsourcing.packages=eu.wohlben.qits.eventsourcing.entity
quarkus.flyway.eventsourcing.migrate-at-start=true
quarkus.flyway.eventsourcing.clean-at-start=true
quarkus.flyway.eventsourcing.locations=classpath:db/eventsourcing/migration

# This module registers no route of its own — quarkus-websockets-next is here for its CLIENT — but
# the extension brings an HTTP server along and a @QuarkusTest starts it. Three test classes here
# ask for different configurations, so Quarkus restarts between them, and on the default 8081 that
# is precisely the repo's known flake (AGENTS.md): the next instance races the previous one's
# release. Port 0 takes a free one instead, the same move service/pom.xml makes for
# CiPackagedSurfaceIT. Nothing here addresses the app's own port, so the value costs nothing.
quarkus.http.test-port=0

# The scheduler must not sweep behind a test's back: every outbox assertion drives OutboxSweeper#sweep
# by hand, against a clock it moved, and a background tick landing in the middle would make the
# attempt counts non-deterministic. The job still registers, so the @Scheduled wiring is real — it
# simply never fires inside a suite run.
qits.eventsourcing.sweep-interval=24h

# The redial backoff, shrunk so the reconnect assertion costs milliseconds. The SHAPE is what is
# under test (a drop is followed by a new connection carrying a fresh subscribe frame), not the
# duration, and the shipped values are in the jar's own properties where they belong.
qits.eventsourcing.redial-initial-backoff=PT0.05S
qits.eventsourcing.redial-max-backoff=PT0.2S
