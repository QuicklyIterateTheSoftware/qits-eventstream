# The suite runs against an EMBEDDED POSTGRES — real binaries, spawned as a child process by zonky,
# never a container, because a clone of this repo tests green with no docker. Its port is chosen at
# run time, so url/username/password are not written here at all: EmbeddedPgConfigSource supplies
# them at an ordinal above this file, and the db-kind comes from the jar's own shipped defaults.
# What is left here is what a file can say. clean-at-start wipes the schema between Quarkus
# restarts, which is what keeps a suite sharing one database across classes reproducible.
quarkus.hibernate-orm.eventstream.datasource=eventstream
quarkus.hibernate-orm.eventstream.packages=eu.wohlben.qits.eventstream.entity
quarkus.flyway.eventstream.migrate-at-start=true
quarkus.flyway.eventstream.clean-at-start=true
quarkus.flyway.eventstream.locations=classpath:db/eventstream/migration

# NO DEV SERVICES. A dev service is a container start, and a datasource whose url arrives from a
# config source rather than a file is exactly the shape that invites one if anything ever goes wrong
# with that source. This says no once, out loud, instead of leaving it to luck.
quarkus.devservices.enabled=false

# This module registers no route of its own — quarkus-websockets-next is here for its CLIENT — but
# the extension brings an HTTP server along and a @QuarkusTest starts it. Three test classes here
# ask for different configurations, so Quarkus restarts between them, and on the default 8081 that
# is precisely the repo's known flake (AGENTS.md): the next instance races the previous one's
# release. Port 0 takes a free one instead, the same move service/pom.xml makes for
# CiPackagedSurfaceIT. Nothing here addresses the app's own port, so the value costs nothing.
quarkus.http.test-port=0

# The scheduler must not sweep behind a test's back: every outbox assertion drives OutboxSweeper#sweep
# by hand, against a clock it moved, and a background tick landing in the middle would make the
# attempt counts non-deterministic. A long interval is insufficient because the scheduler may run
# once at startup; disable automatic execution for the test profile instead. The @Scheduled method
# is still discovered at build time, while its behaviour is covered through those direct calls.
quarkus.scheduler.enabled=false

# No catch-up sweep at boot either. quarkus.scheduler.enabled above keeps the TICK out; this keeps
# out the other half, which is a virtual thread the startup observer fires and which would otherwise
# be reading the stub's log while a test is arranging it. Every catch-up assertion drives
# CatchupSweeper#catchUp by hand, exactly as the outbox ones drive the sweeper.
qits.eventstream.catchup-at-startup=false

# The redial backoff, shrunk so the reconnect assertion costs milliseconds. The SHAPE is what is
# under test (a drop is followed by a new connection carrying a fresh subscribe frame), not the
# duration, and the shipped values are in the jar's own properties where they belong.
qits.eventstream.redial-initial-backoff=PT0.05S
qits.eventstream.redial-max-backoff=PT0.2S
