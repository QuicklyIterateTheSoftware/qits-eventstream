# Eventstream config defaults, shipped from this library jar. Library jars ship defaults as
# META-INF/microprofile-config.properties (ordinal 100) — a jar's application.properties is ignored
# — read by whichever app pulls the jar in (`ci` and the qits-projects `epics` module ship their
# config the same way). The consuming app (250) and the environment (300) override any of these.

# ---------------------------------------------------------------------------------------------
# Where qits-events answers: scheme + host + port, NO PATH. The platform shape, the same one
# qits.ci.git-host-url and qits.cd.intake-url follow — the service is a deployment fact and the
# path is the client's knowledge. This module appends both of them itself: /events/api/events/{id}
# for the idempotent PUT and /events/stream for the websocket, with the scheme swapped to ws(s) for
# the second. Setting a path here yields a doubled one and a 404 nothing retries out of.
#
# The default is the qits-net alias, which is right for any deployment on that network and wrong
# for a host-run process, exactly like qits.artifacts.npm.* — a stack that publishes qits-events on
# a mapped localhost port overrides it.
qits.events.url=http://qits-events:8080

# The module's master switch, on by default because a library that ships dark is a library whose
# first deployment discovers it was never wired up. The DARKNESS BELONGS TO THE CONSUMER: the
# deployable's application.properties is where %dev and %test turn it off, the same policy OTel
# carries, so a `quarkus:dev` with no qits-events on the far side makes no dials rather than
# retries. Off means publish() is a debug log, the sweeper does nothing, and the subscriber never
# dials — there is no half-enabled state.
qits.eventstream.enabled=true

# How long the INLINE publish attempt may take before it is treated as "not now" and handed to the
# outbox. Short on purpose: the call sits on the publishing service's own thread — for qits-ci, the
# single-threaded run worker between one pipeline and the next — so this is the price every green
# build pays while qits-events is unreachable, and the outbox exists precisely so that price stays
# a few seconds instead of a retry budget's worth. The connect timeout is a separate two seconds,
# in EventsPublisher, where a static HttpClient could not go.
qits.eventstream.publish-timeout=PT5S

# The retry budget and how often the sweeper looks. attempts COUNT THE INLINE ONE, so five means
# the inline PUT plus four sweeps, spaced 1s / 4s / 16s / 64s by RetrySchedule; the spacing is held
# per row in next_attempt_at, so the cadence below is only a floor on how late a retry can be and
# never causes an early send. Raising max-attempts extends the schedule (1s · 4^n, capped at 5m)
# rather than repeating the last gap.
qits.eventstream.max-attempts=5
qits.eventstream.sweep-interval=10s

# The subscriber's redial backoff: doubled per consecutive failure from the first value, capped at
# the second. Gentler than the outbox's factor of four because the stream is live-only — what is
# broadcast during a disconnect is not replayed, so a long backoff loses events rather than merely
# delaying them, and the cost of coming back a little eagerly is one handshake.
qits.eventstream.redial-initial-backoff=PT1S
qits.eventstream.redial-max-backoff=PT30S

# ---------------------------------------------------------------------------------------------
# This module owns its OWN named datasource + persistence unit + Flyway lineage: its own postgres
# database, never sharing the consuming service's database or its migration history. That is the
# `ci` and `epics` shape, and here it is load-bearing twice over — the outbox must survive the
# process, and this module already left the repository it grew in, which the split is what made
# cheap.
#
# THE THREE KEYS BELOW ARE THE PLATFORM'S GENERIC RESOURCE CONTRACT, read back by the jar that
# needs it. A consuming repository declares `resources: postgresql:eventstream:<database>` in its
# .config/qits/deployments.yml; qits-deployments creates the role and the database before the
# cutover and injects QITS_RESOURCE_EVENTSTREAM_URL / _USERNAME / _PASSWORD into the container it
# starts. Nothing in the deployer is eventstream-specific — an application maps the generic
# variables in its own shipped defaults, and this file is where this library does it. The variable
# names follow the resource NAME, so a consumer that renames the resource stops matching this file:
# the name is `eventstream`, in every consumer.
#
# THE TRIPLE HAS NO DEFAULTS AND THAT IS THE REFUSE-TO-BOOT STANCE. An unset variable leaves these
# expressions unresolvable, so the process dies at Flyway's migrate-at-start naming what is missing,
# rather than opening some fallback store nobody meant. There is no local file to fall back to any
# more — and that is the end of the AUTO_SERVER-shaped class of bug this jar cost a rollout over
# once: the shipped default carried a `${user.home}` a container has no value for, and only the
# packaged artifact in its real environment ever found out. A default with no feature in it cannot
# lose one.
quarkus.datasource.eventstream.db-kind=postgresql
quarkus.datasource.eventstream.jdbc.url=${QITS_RESOURCE_EVENTSTREAM_URL}
quarkus.datasource.eventstream.username=${QITS_RESOURCE_EVENTSTREAM_USERNAME}
quarkus.datasource.eventstream.password=${QITS_RESOURCE_EVENTSTREAM_PASSWORD}

# A dedicated persistence unit bound to that datasource, owning only this module's entity. packages
# assigns entity→PU unambiguously, which is what keeps the outbox out of the consuming service's
# default persistence unit.
quarkus.hibernate-orm.eventstream.datasource=eventstream
quarkus.hibernate-orm.eventstream.packages=eu.wohlben.qits.eventstream.entity

# Own Flyway lineage at a distinct classpath location so it never mixes with a consumer's. ONE
# lineage: the move to postgres is a clean start, so there is a single V1 and no history inherited
# from the H2 files (see V1__init.sql's header for why that was allowed).
#
# baseline-on-migrate is GONE with that lineage. It told Flyway to adopt a non-empty schema it had
# no history table for, which the H2 file needed while it was being adopted; every database this
# code now meets is empty or was created by this very lineage, and the flag would only mask the one
# case worth failing on — a schema somebody else put there.
quarkus.flyway.eventstream.migrate-at-start=true
quarkus.flyway.eventstream.locations=classpath:db/eventstream/migration
