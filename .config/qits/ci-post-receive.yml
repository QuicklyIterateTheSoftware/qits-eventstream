steps:
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      set -eu
      # qits-db-core resolves from the platform registry; the pom's default
      # names localhost:8081, unreachable from inside a step container.
      ./mvnw -B -ntp verify -Dqits.maven.repository.url="$QITS_MAVEN_REGISTRY_URL"
