steps:
  - image: qits/build-images/maven-base:latest
    user: build
    timeout-seconds: 1800
    script: |
      set -eu
      # qits-db-core resolves from the platform registry; the pom's default
      # names localhost:8081, unreachable from inside a step container, and
      # the derived address needs the exact-id mirror to pass Maven's HTTP
      # blocker (see .qits-maven-settings.xml).
      #
      # `user: build` above, and NOT a switch inside this script. The suite
      # starts zonky's embedded postgres, initdb refuses to run as root and
      # calls getpwuid, so the step needs a passwd-backed non-root user —
      # maven-base carries one (uid 1001). Measured 2026-08-11 (run c916d334
      # red, same tree green as a user).
      #
      # The user has to be chosen at `docker run` because a step container is
      # started `--cap-drop=ALL`: without CAP_SETUID and CAP_SETGID `su`
      # cannot switch user at all, and without CAP_CHOWN even root cannot
      # chown. The adduser/chown/su lines that stood here could never have
      # worked; they were first exercised on 2026-08-12, on qits-containers,
      # and died on `chown: /workspace: Operation not permitted`.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      ./mvnw -B -ntp -s .qits-maven-settings.xml verify \
        -Dqits.maven.repository.url="$QITS_MAVEN_REPOSITORY_URL"
