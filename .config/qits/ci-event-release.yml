# THE TAG STARTS THIS, NOT THE RELEASE ANNOUNCEMENT. `SCMPublishTag` is the git host's fact that a
# tag ref landed, so this pipeline runs for a real release AND for a bootstrap replay, which pushes
# the tags and nothing else. That is the restore path this file exists to serve
# (bootstrap-replay-plan.md in the wrapper). `artifacts:` is unchanged and still a declaration:
# qits-ci announces `SoftwareRelease` only where a green run and an `SCMRelease` meet, so a replay
# republishes silently and a real release announces exactly as before.
event: SCMPublishTag
when:
  # repoName, not repoId: since the identity cutover the git host's own coordinate is an opaque
  # UUID, so a name match on repoId never fires. The tag event echoes the public name the push
  # was addressed with; a rename updates this line in the same campaign.
  - repoName: { exact: qits-eventstream-javalib }
artifacts:
  - { type: maven, name: "eu.wohlben.qits:qits-eventstream" }
steps:
  - image: qits/build-images/maven-base:latest
    timeout-seconds: 1800
    script: |
      set -eu
      # THE TAG NAME IS THE VERSION. Nothing upstream vets it now that any tag push reaches here,
      # and it becomes a registry coordinate, so the shape is checked before anything is fetched or
      # deployed: a CalVer is digits and dots.
      version=$(printf '%s' "$QITS_EVENT_PAYLOAD" | jq -er .tagName)
      case "$version" in
        ''|*[!0-9.]*) echo "not a CalVer tag: $version" >&2; exit 1 ;;
      esac
      git fetch "$QITS_CI_REPOSITORY_URL" "refs/tags/$version:refs/tags/$version"
      git checkout --detach "$version"
      if curl -fsS -o /dev/null "$QITS_MAVEN_REGISTRY_URL/eu/wohlben/qits/qits-eventstream/$version/qits-eventstream-$version.pom"; then
        echo "qits-eventstream@$version is already published — skipping"
        exit 0
      fi
      # qits-db-core resolves from the platform registry. The pom's default
      # names localhost:8081 (unreachable inside a step container), and the
      # derived non-localhost address then needs the exact-id mirror in
      # .qits-maven-settings.xml to get past Maven's HTTP blocker — the same
      # pair every service's image build uses.
      export QITS_MAVEN_REPOSITORY_URL="$QITS_MAVEN_REGISTRY_URL"
      # Maven Central through the platform mirror's in-network alias — empty (an older qits-ci that
      # injects nothing, or a deployment that turned the mirror plane off) deactivates the settings
      # profile and Central is resolved directly.
      export QITS_MAVEN_CENTRAL_URL="${QITS_MAVEN_PROXY_URL:-}"
      # This script is read from main's head, but the checkout above is the
      # release TAG — which may predate a file the script names. The settings
      # file arrived 2026-08-11 (2e72f6c); a bootstrap replaying an older tag
      # measured the miss (attempt 5, phase 46). Guard on presence: a tree old
      # enough to lack the mirror also predates the qits-db-core dependency
      # that needs it.
      settings=""
      if [ -f .qits-maven-settings.xml ]; then
        settings="-s .qits-maven-settings.xml"
      fi
      ./mvnw -B -ntp $settings deploy -DskipTests \
        -Dqits.maven.repository.url="$QITS_MAVEN_REGISTRY_URL" \
        -DaltDeploymentRepository="qits::default::$QITS_MAVEN_REGISTRY_URL"
      # THE SBOM IS THE ARTIFACT'S RESOLVED DEPENDENCY TREE, and it goes up in this step, after the
      # deploy and before the run goes green. That ordering is the whole rule: qits-ci announces
      # `SoftwareRelease` only for a green run, so an SBOM published here can never be missing for a
      # version somebody was told about. A failed PUT fails the release ON PURPOSE — the store being
      # down is not a reason to announce a version whose bill of materials nobody has.
      #
      # The plugin is resolved from the same repositories mvnw already resolves through, so it needs
      # the same `$settings` mirror and the same repository property the deploy above needed; there
      # is no second channel and no address spelled here.
      ./mvnw -B -ntp $settings -DskipTests \
        org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom \
        -DoutputFormat=json -DoutputName=sbom -DschemaVersion=1.6 \
        -Dqits.maven.repository.url="$QITS_MAVEN_REGISTRY_URL"
      # The SBOM store is a sibling path of the maven registry inside the same qits-artifacts
      # deployment, so its root is DERIVED from the injected one rather than written down — the same
      # discipline every other address in this file follows.
      sbom_base="${QITS_MAVEN_REGISTRY_URL%%/artifacts/*}/artifacts/sboms"
      curl -fsS -X PUT -H 'Content-Type: application/vnd.cyclonedx+json' \
        --data-binary @target/sbom.json \
        "$sbom_base/maven/eu.wohlben.qits:qits-eventstream/-/$version"
